<!-- Contact section (brief §2.4): warm band, headline, one button that opens the form panel. Without JavaScript the form is simply visible. -->
<section class="contact section reveal" id="contact" aria-labelledby="contact-title">
  <div class="container">
    <div class="band band-warm">
      <div class="contact-intro">
        <h2 id="contact-title"><span class="mask"><span class="mask-in">{{ shared.contact.headline }}</span></span></h2>
        <p class="lead">{{ shared.contact.line }} {{ shared.contact.response_time }}</p>
        <div class="contact-actions">
          <button class="btn btn-primary" type="button" data-contact-open aria-expanded="false" aria-controls="contact-panel">{{ shared.contact.open_button }}<span class="btn-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></button>
          <p class="small">{{ shared.contact.book_prefix }} <a href="/book-a-call/">{{ shared.contact.book_link }}</a></p>
        </div>
      </div>
      <div class="contact-panel" id="contact-panel">
        <div class="card">
          <div class="contact-panel-head">
            <h3>{{ shared.contact.form.title }}</h3>
            <button class="close-btn" type="button" data-contact-close aria-label="{{{ shared.contact.close }}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div>
          <!-- @include _partials/contact-form.html -->
        </div>
      </div>
    </div>
  </div>
</section>
