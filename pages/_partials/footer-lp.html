<!-- Slim footer for standalone landing pages: the line, the legal links, a way to the full site. -->
<footer class="site-footer lp-footer">
  <div class="container footer-bottom">
    <p>&copy; {{ site.year }} {{ site.name }}. {{ shared.lp.footer_line }}</p>
    <p class="cluster"><a href="/">{{ shared.lp.footer_site }}</a><a href="/legal-notice/">{{ shared.footer.legal_notice }}</a><a href="/privacy/">{{ shared.footer.privacy }}</a></p>
  </div>
</footer>
