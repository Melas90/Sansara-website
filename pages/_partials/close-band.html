<!-- Closing band (Cris's dark band with one fine circle). "Let's talk" opens the lead pop-up. No calendar for now (2026-09-27): the form is the way in. -->
<div class="c-close" id="contact">
  <div class="close-circle" aria-hidden="true"></div>
  <section class="contact section" aria-labelledby="contact-title">
    <div class="container">
      <div class="band">
        <div class="contact-intro">
          <h2 id="contact-title"><span class="mask"><span class="mask-in">{{ shared.contact.headline }}</span></span></h2>
          <p class="lead">{{ shared.contact.line }} {{ shared.contact.response_time }}</p>
          <div class="contact-actions">
            <a class="btn btn-primary" href="#lead" data-lead-open data-source="closing band">{{ shared.contact.open_button }}<span class="btn-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
