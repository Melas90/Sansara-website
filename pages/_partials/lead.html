<!--
  Lead pop-up (owner request 2026-09-27). One Netlify form, "lead", opened by any element with
  data-lead-open (optional data-topic preselects the interest, data-source names the trigger).
  Without JavaScript the triggers are plain links to #lead and the dialog shows as a normal section.
  A hidden "source" field tells the CRM which button and page the lead came from.
-->
<button class="lead-float" type="button" data-lead-open data-source="floating button" aria-label="{{{ shared.lead.float }}}" hidden><span class="lead-float-label">{{ shared.lead.float }}</span><span class="btn-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></button>
<dialog class="lead-dialog" id="lead" aria-labelledby="lead-title">
  <div class="lead-inner">
    <div class="lead-head">
      <div class="stack-sm">
        <h2 id="lead-title">{{ shared.lead.title }}</h2>
        <p>{{ shared.lead.intro }}</p>
      </div>
      <button class="close-btn" type="button" data-lead-close aria-label="{{{ shared.lead.close }}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <form class="lead-form" name="lead" method="POST" action="/contact/thanks/" data-netlify="true" netlify-honeypot="bot-field"
      data-msg-required="{{{ shared.lead.required }}}"
      data-msg-contact="{{{ shared.lead.need_contact }}}"
      data-msg-email="{{{ shared.lead.invalid_email }}}"
      data-msg-whatsapp="{{{ shared.lead.invalid_whatsapp }}}"
      data-msg-country="{{{ shared.lead.need_country_code }}}"
      data-msg-consent="{{{ shared.lead.consent_needed }}}"
      data-msg-sending="{{{ shared.lead.sending }}}">
      <input type="hidden" name="form-name" value="lead">
      <input type="hidden" name="source" value="">
      <!-- Ad origin, filled by lead.js from the ad link; the CRM marks the lead as coming from an ad -->
      <input type="hidden" name="utm_source" value="">
      <input type="hidden" name="utm_campaign" value="">
      <input type="hidden" name="utm_content" value="">
      <input type="hidden" name="fbclid" value="">
      <p class="honeypot" aria-hidden="true"><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <div class="form-grid">
        <div class="field span-2">
          <label for="l-name">{{ shared.lead.name }}</label>
          <input class="control" id="l-name" name="name" type="text" required autocomplete="name">
          <p class="field-error" aria-live="polite"></p>
        </div>
        <!-- Email, WhatsApp, or both (owner, 2026-10-15): at least one, each checked when filled in.
             The CRM reads `email` and `whatsapp` as they are, and still reads the older `reach`. -->
        <div class="field">
          <label for="l-email">{{ shared.lead.email }}</label>
          <input class="control" id="l-email" name="email" type="email" autocomplete="email" inputmode="email" aria-describedby="l-contact-hint" data-contact="email">
          <p class="field-hint" id="l-contact-hint">{{ shared.lead.contact_hint }}</p>
          <p class="field-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="l-whatsapp">{{ shared.lead.whatsapp }}</label>
          <div class="wa-wrap">
            <input class="control" id="l-whatsapp" name="whatsapp" type="tel" autocomplete="tel" inputmode="tel" aria-describedby="l-whatsapp-hint" data-contact="whatsapp">
            <svg class="wa-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2a8.8 8.8 0 0 0-7.6 13.2L3.2 20.8l4.5-1.2A8.8 8.8 0 1 0 12 3.2z"/><path d="M9.2 7.9c-.4 0-.8.4-.9.9-.2 1.3.4 2.9 1.7 4.2 1.4 1.4 3 2.1 4.3 1.9.5-.1.9-.5.9-.9v-.9l-1.8-.8-.9.9c-1-.4-2-1.4-2.4-2.4l.9-.9-.8-1.8z"/></svg>
          </div>
          <p class="field-hint" id="l-whatsapp-hint">{{ shared.lead.whatsapp_hint }}</p>
          <p class="field-error" aria-live="polite"></p>
        </div>
        <div class="field span-2">
          <label for="l-interest">{{ shared.lead.interest }}</label>
          <div class="select-wrap">
            <select class="control" id="l-interest" name="interest" required>
              <option value="" selected disabled>{{ shared.lead.interest_placeholder }}</option>
              {{#each shared.lead.interest_options}}<option value="{{{ this }}}">{{ this }}</option>{{/each}}
            </select>
          </div>
          <p class="field-error" aria-live="polite"></p>
        </div>
        <div class="field span-2">
          <label class="check"><input type="checkbox" id="l-privacy" name="privacy" value="yes" required><span>{{ shared.lead.privacy }}</span></label>
          <p class="field-error" aria-live="polite"></p>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit"><span class="btn-label">{{ shared.lead.submit }}</span><span class="btn-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></button>
      </div>
    </form>
    <div class="form-state form-success" hidden role="status">
      <svg class="check-draw" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25"/><path d="M18 29l7 7 14-15"/></svg>
      <h3 tabindex="-1">{{ shared.lead.success_title }}</h3>
      <p>{{ shared.lead.success_text }}</p>
      <!-- lead.js fills in the WhatsApp link with the visitor's name once the form is saved -->
      <a class="btn btn-primary lead-book" href="https://wa.me/{{{ shared.lead.whatsapp_number }}}" target="_blank" rel="noopener" data-whatsapp="{{{ shared.lead.whatsapp_number }}}" data-whatsapp-message="{{{ shared.lead.whatsapp_message }}}">{{ shared.lead.book_button }}<span class="btn-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span></a>
    </div>
    <div class="form-state form-error" hidden role="alert">
      <h3>{{ shared.lead.error_title }}</h3>
      <p>{{ shared.lead.error_text }}</p>
    </div>
  </div>
</dialog>
<script src="/assets/lead.js" defer></script>
