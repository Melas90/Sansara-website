# Production = main. Branch deploy = v2 while the rebuild is in progress (enable it in the
# Netlify UI: Site configuration > Build & deploy > Branches and deploy contexts).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Ad address: loop.sansara-media.com opens straight on the Client Loop landing.
# Netlify passes the query string along, so utm_* and fbclid from the ad reach the page.
[[redirects]]
  from = "https://loop.sansara-media.com/"
  to = "https://loop.sansara-media.com/client-loop/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/brand/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# connect-src also allows the Meta Conversions API Gateway set up for the Pixel in Events Manager ("openbridge":
# a primary endpoint on AWS and a fallback on Google Cloud, 2026-10-17). If the gateway is ever re-created in
# Meta, its hosts change: copy the new ones from the Pixel config (connect.facebook.net/signals/config/<pixel id>).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # script-src: our own files plus the hash of the one inline line in _partials/head.html
    # (document.documentElement.classList.add('js')). Recompute the hash if that line changes.
    # frame-src 'self' is for the lab's phone-width preview. The booking calendar host is added in Step 6.
    # Meta Pixel (assets/pixel.js): its script comes from connect.facebook.net and it sends events
    # to www.facebook.com (as image, fetch and beacon requests).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Du+OJKJSbdUgz5nrHeWWINvez6XKDDU/tyj/5c2uvwo=' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.facebook.com; font-src 'self'; connect-src 'self' https://www.facebook.com https://connect.facebook.net https://md-eecad2978f7a43f5b7838c919258e6de.ecs.us-east-2.on.aws https://bded8a3c6ae-1-1053047382554.us-central1.run.app; frame-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
